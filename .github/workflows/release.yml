name: Build and Release CLI

on:
  # Chỉ tự động release khi bạn push tag có dạng v1.0.0, v0.1.0...
  push:
    tags:
      - 'v*'
  # Cho phép bấm nút chạy thủ công trên web GitHub để test mà không cần tạo tag
  workflow_dispatch:

permissions:
  # Bắt buộc có quyền này để job cuối tạo GitHub Release
  contents: write

jobs:
  build:
    name: Build (${{ matrix.asset_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Nếu 1 OS lỗi, 2 OS còn lại vẫn chạy hết để bạn xem log
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset_name: scrape-linux-x64
            ext: tar.gz
          - os: windows-latest
            asset_name: scrape-windows-x64
            ext: zip
          - os: macos-latest
            asset_name: scrape-macos-arm64
            ext: tar.gz

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller

      - name: Build binary with PyInstaller
        run: pyinstaller --clean scrape.spec

      - name: Smoke test (Linux & macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x dist/scrape
          ./dist/scrape --help

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\dist\scrape.exe --help

      - name: Package archive (Linux & macOS)
        if: runner.os != 'Windows'
        run: |
          cd dist
          tar -czvf ../${{ matrix.asset_name }}.tar.gz scrape

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\scrape.exe -DestinationPath ${{ matrix.asset_name }}.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.${{ matrix.ext }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Chỉ tạo Release thật khi chạy bằng Git tag
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd release_assets
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release_assets/*