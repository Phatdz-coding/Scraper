[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scrape"
version = "0.1.0"
description = "Document scraper for Google Drive, Google Docs, and Scribd"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4",
    "img2pdf",
    "playwright",
    "requests",
    "rich",
    "typer",
    "urllib3",
]

[project.optional-dependencies]
dev = ["pytest", "pyinstaller"]

[project.scripts]
scrape = "scrape.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scrape = ["scripts/*.js"]
